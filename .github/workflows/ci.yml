name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # The committed registry must equal a rebuild from the installed packages and the code hash cache (no network).
      - run: npm run registry:build -- --offline --check

      - run: npm test

      - run: npm run build

  # The browser smoke test: the built fixture page under the CSP from public/_headers, at 400 px, light and dark.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Downloads Chromium and installs the system libraries it needs on the runner.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
